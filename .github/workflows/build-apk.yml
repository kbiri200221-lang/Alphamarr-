name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'icon-192.png'
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Installer le SDK Android
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Copier l'app web et l'icone dans le projet Android
        run: |
          mkdir -p android-app/app/src/main/assets
          cp index.html android-app/app/src/main/assets/index.html
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          cp icon-192.png android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: alphamarr-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
