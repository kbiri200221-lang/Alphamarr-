name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'icon-192.png'
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        run: |
          SDK="$ANDROID_SDK_ROOT"
          [ -z "$SDK" ] && SDK="$ANDROID_HOME"
          echo "SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Copier l'app web et l'icone dans le projet Android
        run: |
          mkdir -p android-app/app/src/main/assets
          cp index.html android-app/app/src/main/assets/index.html
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          cp icon-192.png android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: alphamarr-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK en Release (téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Alphamarr APK ${{ github.run_number }}
          make_latest: true
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
